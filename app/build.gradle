apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

// 读取签名信息（统一从 keystore.properties 加载）
def keystorePropertiesFile = rootProject.file("app/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 读取版本号（从 version.properties 加载）
def versionPropertiesFile = rootProject.file("version.properties")
def versionProperties = new Properties()
if (versionPropertiesFile.exists()) {
    versionProperties.load(new FileInputStream(versionPropertiesFile))
}
def appVersionName = versionProperties['VERSION_NAME']?.toString() ?: '1.0.0'
def appVersionCode = (versionProperties['VERSION_CODE']?.toString() ?: '1').toInteger()

android {
    namespace "com.demo.snakexin"
    compileSdk 36

    defaultConfig {
        applicationId "com.demo.snakexin"
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName

        // Restrict native libraries to 64-bit ABIs only.
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    // 固定 release 签名：使用项目自带的 snakexin-release.keystore，
    // 保证后续版本升级时签名一致，能够直接覆盖安装。
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // 媒体播放（备注音视频）
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    // 图片加载（备注照片缩略图）
    implementation "io.coil-kt:coil:2.7.0"
}
