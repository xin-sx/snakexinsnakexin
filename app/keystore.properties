## This file is committed to the repo so that the release signing key
## stays consistent across machines and builds. If you fork this project,
## replace these values with your own keystore (generate one with
## `keytool -genkey -v -keystore snakexin-release.keystore -alias snakexin ...`).
storeFile=snakexin-release.keystore
storePassword=snakexin123
keyAlias=snakexin
keyPassword=snakexin123
